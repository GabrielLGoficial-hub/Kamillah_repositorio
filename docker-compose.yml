services:
  app:
    build: .
    ports:
      - "8080:80"              # acessa em http://localhost:8080
    volumes:
      - .:/var/www/html        # mapeia TODO o projeto
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html/public   # opcional, informativo
    depends_on:
      - db

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: Kamillah_padrao
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # opcional, mas muito útil
  adminer:
    image: adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  db_data: