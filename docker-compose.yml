services:
  app:
    build: .
    ports:
      - "8080:80"              # acessa em http://localhost:8080
    volumes:
      - .:/var/www/html        # mapeia TODO o projeto
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html/public   # opcional, informativo
    depends_on:
      - db

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: master
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # opcional, mas muito útil
  phpmyadmin:
    image: phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root 
    depends_on:
      - db

volumes:
  db_data: